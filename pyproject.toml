[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimcheck"
version = "0.1.0"
description = "Dimensional analysis for SymPy expressions: consistency checks, Buckingham-Pi groups and unit conversion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Satish (Siyaramji Tech Solutions)" }]
dependencies = ["sympy>=1.12"]
keywords = ["physics", "units", "dimensional-analysis", "sympy", "llm-evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dimcheck = "dimcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
